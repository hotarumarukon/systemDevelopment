<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>将棋</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    height: 100%;
    background: #1a1410;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Noto Serif JP", serif;
    overflow: hidden;
    touch-action: manipulation;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(ellipse at center, #2a1f17 0%, #120c08 100%);
  }

  .app {
    aspect-ratio: 2 / 3;
    height: 100vh;
    max-width: 100vw;
    width: auto;
    display: flex;
    flex-direction: column;
    background:
      repeating-linear-gradient(180deg, rgba(255,255,255,0.012) 0 2px, transparent 2px 4px),
      linear-gradient(180deg, #1f1812 0%, #160f0a 100%);
    position: relative;
    box-shadow: 0 0 60px rgba(0,0,0,0.6);
  }
  @media (max-aspect-ratio: 2/3) {
    .app { width: 100vw; height: auto; }
  }

  /* Top bar */
  .topbar {
    flex: 0 0 auto;
    padding: 2.5% 4%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(212,175,55,0.15);
  }
  .title {
    font-size: 4.2vmin;
    color: #e8d49a;
    letter-spacing: 0.5em;
    font-weight: 500;
    padding-left: 0.5em;
  }
  .turn-badge {
    font-size: 2.6vmin;
    color: #b8a373;
    padding: 0.4em 0.9em;
    border: 1px solid rgba(212,175,55,0.3);
    border-radius: 2px;
    letter-spacing: 0.2em;
  }
  .turn-badge.active {
    color: #1a1410;
    background: linear-gradient(180deg, #e8d49a, #c8a96a);
    border-color: #c8a96a;
  }
  .menu-btn {
    background: none;
    border: 1px solid rgba(212,175,55,0.3);
    color: #b8a373;
    width: 8vmin; height: 8vmin;
    border-radius: 50%;
    font-size: 4vmin;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .menu-btn:active { background: rgba(212,175,55,0.1); }

  /* Komadai (captured pieces) */
  .komadai {
    flex: 0 0 auto;
    height: 8.5%;
    padding: 0.8% 3%;
    display: flex;
    align-items: center;
    gap: 1.2%;
    overflow-x: auto;
    overflow-y: hidden;
    background: linear-gradient(180deg, rgba(60,40,25,0.5), rgba(40,28,18,0.5));
    border-top: 1px solid rgba(212,175,55,0.08);
    border-bottom: 1px solid rgba(212,175,55,0.08);
  }
  .komadai::-webkit-scrollbar { display: none; }
  .komadai-label {
    font-size: 2.3vmin;
    color: #8a7758;
    letter-spacing: 0.15em;
    flex: 0 0 auto;
    margin-right: 1.5%;
  }
  .captured-piece {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    background: linear-gradient(160deg, #e8c890 0%, #d4a866 100%);
    color: #1a0f06;
    border-radius: 2px;
    padding: 0.3em 0.4em;
    font-size: 2.6vmin;
    cursor: pointer;
    border: 1px solid rgba(80,50,20,0.4);
    transition: transform 0.1s;
  }
  .captured-piece.selected {
    background: linear-gradient(160deg, #ffe9a0 0%, #e8c060 100%);
    transform: translateY(-2px);
    box-shadow: 0 2px 8px rgba(212,175,55,0.5);
  }
  .captured-piece .count {
    font-size: 2vmin;
    margin-left: 0.2em;
    font-weight: bold;
  }
  .komadai.gote .captured-piece { transform: rotate(180deg); }
  .komadai.gote .captured-piece.selected { transform: rotate(180deg) translateY(2px); }

  /* Board */
  .board-wrap {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2% 3%;
    min-height: 0;
  }
  .board {
    aspect-ratio: 1 / 1;
    height: 100%;
    max-width: 100%;
    width: auto;
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    grid-template-rows: repeat(9, 1fr);
    background:
      repeating-linear-gradient(90deg, rgba(80,45,20,0.06) 0 1px, transparent 1px 12px),
      linear-gradient(160deg, #d9b27a 0%, #c89a5a 50%, #b88a48 100%);
    border: 0.6vmin solid #2a1810;
    box-shadow:
      inset 0 0 30px rgba(60,30,10,0.3),
      0 0 20px rgba(0,0,0,0.5),
      0 0 0 1px rgba(255,220,150,0.1);
    position: relative;
  }
  .cell {
    border-right: 1px solid rgba(40,20,5,0.5);
    border-bottom: 1px solid rgba(40,20,5,0.5);
    position: relative;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cell:nth-child(9n) { border-right: none; }
  .cell:nth-last-child(-n+9) { border-bottom: none; }
  /* Star points (4 dots between 3-3 lines) */
  .board::before, .board::after,
  .board > .star1, .board > .star2 {
    content: '';
    position: absolute;
    width: 0.8vmin; height: 0.8vmin;
    background: #2a1810;
    border-radius: 50%;
    pointer-events: none;
  }
  .board::before { left: 33.333%; top: 33.333%; transform: translate(-50%, -50%); }
  .board::after  { left: 66.666%; top: 33.333%; transform: translate(-50%, -50%); }

  .cell.legal::after {
    content: '';
    position: absolute;
    width: 30%; height: 30%;
    border-radius: 50%;
    background: rgba(40,90,160,0.45);
    box-shadow: 0 0 8px rgba(80,140,220,0.6);
    pointer-events: none;
  }
  .cell.legal.capture::after {
    width: 80%; height: 80%;
    background: transparent;
    border: 0.4vmin solid rgba(180,40,40,0.7);
    box-shadow: inset 0 0 8px rgba(180,40,40,0.4);
  }
  .cell.selected {
    background: rgba(255,220,120,0.35);
    box-shadow: inset 0 0 0 0.4vmin rgba(212,175,55,0.7);
  }
  .cell.last-move {
    background: rgba(120,160,220,0.18);
  }
  .cell.check {
    background: rgba(220,60,60,0.3);
  }

  /* Piece */
  .piece {
    width: 88%;
    height: 88%;
    background: linear-gradient(160deg, #f4dca0 0%, #d9b073 50%, #c89a5a 100%);
    clip-path: polygon(50% 4%, 88% 22%, 96% 100%, 4% 100%, 12% 22%);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #1a0f06;
    font-size: 4.2vmin;
    font-weight: 600;
    line-height: 1;
    position: relative;
    filter: drop-shadow(0 0.3vmin 0.5vmin rgba(0,0,0,0.4));
    transition: transform 0.15s;
  }
  .piece.gote { transform: rotate(180deg); }
  .piece.promoted { color: #8a1d1d; }
  .piece .label {
    transform: translateY(0.3vmin);
  }
  .piece.small {
    font-size: 2.4vmin;
  }
  .piece.small .label { transform: translateY(0); }

  /* Modal */
  .modal-back {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    backdrop-filter: blur(4px);
  }
  .modal-back.show { display: flex; }
  .modal {
    background: linear-gradient(180deg, #2a1f17, #1a1208);
    border: 1px solid rgba(212,175,55,0.4);
    border-radius: 4px;
    padding: 6vmin 5vmin;
    color: #e8d49a;
    text-align: center;
    max-width: 80%;
    box-shadow: 0 10px 40px rgba(0,0,0,0.7);
  }
  .modal h2 {
    font-size: 3.6vmin;
    letter-spacing: 0.3em;
    font-weight: 500;
    margin-bottom: 4vmin;
    color: #e8d49a;
  }
  .modal p {
    font-size: 2.6vmin;
    color: #b8a373;
    margin-bottom: 3vmin;
    letter-spacing: 0.1em;
  }
  .modal .btnrow {
    display: flex;
    gap: 3vmin;
    justify-content: center;
    flex-wrap: wrap;
  }
  .btn {
    background: linear-gradient(180deg, #c8a96a 0%, #a08440 100%);
    border: 1px solid #8a6a30;
    color: #1a0f06;
    padding: 1.5vmin 3.5vmin;
    font-size: 2.6vmin;
    letter-spacing: 0.2em;
    border-radius: 2px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 600;
    min-width: 18vmin;
  }
  .btn:active { transform: translateY(1px); filter: brightness(0.9); }
  .btn.ghost {
    background: transparent;
    color: #b8a373;
    border-color: rgba(212,175,55,0.4);
    font-weight: normal;
  }
  .btn.toggle:not(.active) {
    background: transparent;
    color: #b8a373;
    border-color: rgba(212,175,55,0.3);
    font-weight: normal;
  }

  .level-section {
    margin-top: 4vmin;
    padding-top: 4vmin;
    border-top: 1px solid rgba(212,175,55,0.15);
  }
  .level-section.hidden { display: none; }
  .level-section .label {
    font-size: 2.4vmin;
    color: #8a7758;
    letter-spacing: 0.2em;
    margin-bottom: 1.5vmin;
  }
  .level-display {
    font-size: 4.5vmin;
    color: #e8d49a;
    margin-bottom: 0.5em;
    letter-spacing: 0.1em;
  }
  .level-display .num { color: #f4d060; font-weight: bold; }
  .level-name {
    font-size: 2.4vmin;
    color: #b8a373;
    margin-bottom: 2vmin;
    letter-spacing: 0.15em;
    min-height: 1em;
  }
  .level-slider {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 1vmin;
    background: linear-gradient(90deg,
      rgba(150,150,150,0.4) 0%,
      rgba(212,175,55,0.5) 50%,
      rgba(220,80,40,0.6) 100%);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
  .level-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 6.5vmin;
    height: 6.5vmin;
    border-radius: 50%;
    background: linear-gradient(180deg, #f4dca0 0%, #c8a96a 100%);
    cursor: pointer;
    border: 0.4vmin solid #2a1810;
    box-shadow: 0 0.4vmin 1vmin rgba(0,0,0,0.5);
  }
  .level-slider::-moz-range-thumb {
    width: 6.5vmin;
    height: 6.5vmin;
    border-radius: 50%;
    background: linear-gradient(180deg, #f4dca0 0%, #c8a96a 100%);
    border: 0.4vmin solid #2a1810;
    box-shadow: 0 0.4vmin 1vmin rgba(0,0,0,0.5);
    cursor: pointer;
  }
  .level-marks {
    display: flex;
    justify-content: space-between;
    margin-top: 1.2vmin;
    font-size: 1.8vmin;
    color: #6a5a3a;
    padding: 0 0.5vmin;
  }
  .label .sub-note {
    font-size: 1.7vmin;
    color: #6a5a3a;
    letter-spacing: 0;
  }

  .pda-row {
    margin-top: 3vmin;
    display: flex;
    flex-direction: column;
    gap: 1.2vmin;
  }
  .pda-label {
    font-size: 2vmin;
    color: #8a7758;
    letter-spacing: 0.2em;
  }
  .pda-buttons {
    display: flex;
    gap: 1vmin;
  }
  .pda-btn {
    flex: 1 1 0;
    min-width: 0;
    padding: 1.2vmin 0.4vmin;
    font-size: 1.85vmin;
    background: rgba(40,30,20,0.8);
    color: #b8a373;
    border: 0.3vmin solid rgba(212,175,55,0.3);
    border-radius: 0.8vmin;
    cursor: pointer;
    letter-spacing: 0.05em;
    font-family: inherit;
  }
  .pda-btn.active {
    background: linear-gradient(180deg, rgba(212,175,55,0.4), rgba(160,120,40,0.5));
    color: #fff7d0;
    border-color: #d4af37;
  }
  .pda-btn:active { transform: translateY(1px); }

  /* 3-button mode toggle: equal share */
  .mode-toggle .btn.toggle {
    flex: 1 1 0;
    min-width: 0;
    padding: 1.4vmin 0.8vmin;
    font-size: 2.3vmin;
    letter-spacing: 0.1em;
  }

  .modal.scrollable {
    max-height: 92%;
    overflow-y: auto;
    overflow-x: hidden;
  }
  .modal.scrollable::-webkit-scrollbar { width: 0.6vmin; }
  .modal.scrollable::-webkit-scrollbar-track { background: transparent; }
  .modal.scrollable::-webkit-scrollbar-thumb { background: rgba(212,175,55,0.3); border-radius: 1vmin; }

  /* Shop button (in new game modal) */
  .shop-link {
    margin-top: 4vmin;
    padding-top: 4vmin;
    border-top: 1px solid rgba(212,175,55,0.15);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 2vmin;
  }
  .shop-link .label-side {
    text-align: left;
  }
  .shop-link .label-side .name {
    font-size: 2.4vmin;
    color: #b8a373;
    letter-spacing: 0.15em;
  }
  .shop-link .label-side .balance-mini {
    font-size: 2vmin;
    color: #f4d060;
    margin-top: 0.4em;
    letter-spacing: 0.1em;
  }
  .shop-link .open {
    background: linear-gradient(180deg, #b88040 0%, #804020 100%);
    border: 1px solid #602810;
    color: #ffeac0;
    padding: 1.2vmin 2.5vmin;
    border-radius: 2px;
    font-size: 2.4vmin;
    letter-spacing: 0.2em;
    cursor: pointer;
    font-family: inherit;
    font-weight: 600;
  }
  .shop-link .open:active { transform: translateY(1px); filter: brightness(0.9); }

  /* Shop modal */
  .modal.shop-modal {
    width: 92%;
    max-width: 92%;
    max-height: 90%;
    padding: 4vmin 3vmin;
    display: flex;
    flex-direction: column;
  }
  .modal.shop-modal h2 { margin-bottom: 2vmin; }
  .balance-bar {
    flex: 0 0 auto;
    text-align: center;
    padding: 1.5vmin;
    margin-bottom: 2vmin;
    background: linear-gradient(180deg, rgba(244,208,96,0.1), rgba(244,208,96,0.04));
    border: 1px solid rgba(244,208,96,0.25);
    border-radius: 2px;
  }
  .balance-bar .label-text {
    font-size: 2vmin;
    color: #b8a373;
    letter-spacing: 0.3em;
    margin-right: 1em;
  }
  .balance-bar .value {
    font-size: 3.4vmin;
    color: #f4d060;
    font-weight: bold;
    letter-spacing: 0.05em;
  }
  .shop-body {
    flex: 1 1 auto;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 0 0.5vmin;
    text-align: left;
  }
  .shop-section { margin-bottom: 2.5vmin; }
  .section-title {
    font-size: 2.2vmin;
    color: #d4af37;
    letter-spacing: 0.4em;
    margin-bottom: 0.5vmin;
    padding-bottom: 0.8vmin;
    border-bottom: 1px solid rgba(212,175,55,0.2);
  }
  .shop-item {
    display: flex;
    align-items: center;
    padding: 1.8vmin 0.5vmin;
    border-bottom: 1px solid rgba(212,175,55,0.07);
    gap: 2vmin;
  }
  .shop-item .info { flex: 1; min-width: 0; }
  .shop-item .name {
    font-size: 2.4vmin;
    color: #e8d49a;
    letter-spacing: 0.05em;
    margin-bottom: 0.3em;
  }
  .shop-item.owned .name { color: #f4d060; }
  .shop-item.locked .name { color: #5a4a32; }
  .shop-item .desc {
    font-size: 1.9vmin;
    color: #8a7758;
    letter-spacing: 0.03em;
    line-height: 1.4;
  }
  .shop-item.locked .desc { color: #4a3a22; }
  .shop-item .right {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 0.8vmin;
  }
  .shop-item .price {
    font-size: 2vmin;
    color: #c8a96a;
    letter-spacing: 0.05em;
  }
  .shop-item .buy-btn {
    background: linear-gradient(180deg, #c8a96a, #a08440);
    border: 1px solid #8a6a30;
    color: #1a0f06;
    padding: 0.9vmin 2vmin;
    border-radius: 2px;
    font-size: 2vmin;
    cursor: pointer;
    font-family: inherit;
    font-weight: 600;
    min-width: 14vmin;
    letter-spacing: 0.1em;
  }
  .shop-item .buy-btn:disabled {
    background: #2a1f15;
    color: #5a4a32;
    border-color: #3a2a1c;
    cursor: default;
  }
  .shop-item.owned .buy-btn {
    background: linear-gradient(180deg, #4a7a4a, #2a5a2a);
    color: #d0e8c0;
    border-color: #2a4a2a;
  }
  .counter {
    display: flex;
    align-items: center;
    gap: 0.8vmin;
  }
  .counter button {
    width: 5.5vmin; height: 5.5vmin;
    background: #1a1208;
    border: 1px solid #c8a96a;
    color: #c8a96a;
    font-size: 2.6vmin;
    border-radius: 2px;
    cursor: pointer;
    font-family: inherit;
    display: flex; align-items: center; justify-content: center;
    padding: 0;
  }
  .counter button:disabled { opacity: 0.3; cursor: default; }
  .counter button:active:not(:disabled) { transform: translateY(1px); }
  .counter .count {
    min-width: 4vmin;
    text-align: center;
    font-size: 2.6vmin;
    color: #f4d060;
    font-weight: bold;
  }
  .shop-footer {
    flex: 0 0 auto;
    padding-top: 2vmin;
    border-top: 1px solid rgba(212,175,55,0.15);
    margin-top: 1vmin;
  }

  .status {
    flex: 0 0 auto;
    text-align: center;
    padding: 1.2% 3%;
    font-size: 2.4vmin;
    color: #b8a373;
    letter-spacing: 0.15em;
    border-top: 1px solid rgba(212,175,55,0.1);
    min-height: 4vmin;
  }
  .status.warn { color: #e89060; }
  .status.win { color: #f4d060; font-size: 3vmin; }
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="title">将棋</div>
    <div id="turnBadge" class="turn-badge">先手番</div>
    <button id="menuBtn" class="menu-btn" aria-label="メニュー">≡</button>
  </div>

  <!-- Gote (top) komadai -->
  <div class="komadai gote" id="komadaiGote">
    <span class="komadai-label">後手 持駒</span>
  </div>

  <div class="board-wrap">
    <div class="board" id="board"></div>
  </div>

  <!-- Sente (bottom) komadai -->
  <div class="komadai" id="komadaiSente">
    <span class="komadai-label">先手 持駒</span>
  </div>

  <div class="status" id="status">対局を開始してください</div>

  <!-- New game modal -->
  <div class="modal-back show" id="modalNew">
    <div class="modal scrollable">
      <h2>将　棋</h2>
      <p>対局形式</p>
      <div class="btnrow mode-toggle">
        <button class="btn toggle active" data-mode="human">人 対 人</button>
        <button class="btn toggle" data-mode="ai">人 対 AI</button>
        <button class="btn toggle" data-mode="aivsai">AI 対 AI</button>
      </div>

      <div class="level-section hidden" id="senteLevelSection">
        <div class="label">先手 AI<span class="sub-note"> （ショップ強化が適用される側）</span></div>
        <div class="level-display">Lv.<span class="num" id="senteLevelNum">5</span></div>
        <div class="level-name" id="senteLevelName">普通</div>
        <input type="range" min="0" max="20" value="5" class="level-slider" id="senteLevelSlider">
        <div class="level-marks">
          <span>自滅</span>
          <span>普通</span>
          <span>最強</span>
        </div>
        <div class="pda-row">
          <div class="pda-label">攻撃性</div>
          <div class="pda-buttons" id="sentePdaButtons">
            <button class="pda-btn" data-pda="0">完全防御</button>
            <button class="pda-btn active" data-pda="1">均衡</button>
            <button class="pda-btn" data-pda="2">攻撃的</button>
            <button class="pda-btn" data-pda="3">決め手</button>
          </div>
        </div>
      </div>

      <div class="level-section hidden" id="goteLevelSection">
        <div class="label" id="goteLevelLabel">AI レベル</div>
        <div class="level-display">Lv.<span class="num" id="goteLevelNum">5</span></div>
        <div class="level-name" id="goteLevelName">普通</div>
        <input type="range" min="0" max="20" value="5" class="level-slider" id="goteLevelSlider">
        <div class="level-marks">
          <span>自滅</span>
          <span>普通</span>
          <span>最強</span>
        </div>
        <div class="pda-row">
          <div class="pda-label">攻撃性</div>
          <div class="pda-buttons" id="gotePdaButtons">
            <button class="pda-btn" data-pda="0">完全防御</button>
            <button class="pda-btn active" data-pda="1">均衡</button>
            <button class="pda-btn" data-pda="2">攻撃的</button>

<script>
"use strict";

// ============ Constants ============
const SENTE = 0, GOTE = 1;
const N = 9;

// Piece types
const KANJI = {
  K:  { norm:'玉', prom:'帝',  alt:'王' },  // 帝 = upgraded king ("emperor")
  R:  { norm:'飛', prom:'龍' },
  B:  { norm:'角', prom:'馬' },
  G:  { norm:'金', prom:'尊' },                // 尊 = upgraded gold (only used if shop perk owned)
  S:  { norm:'銀', prom:'全' },
  Nk: { norm:'桂', prom:'圭' },
  L:  { norm:'香', prom:'杏' },
  P:  { norm:'歩', prom:'と' },
  D:  { norm:'将', prom:'神' },                // 大将 → 神 (custom shop piece)
  MR: { norm:'車', prom:'俥' },                // 小飛車 → 小飛成
  MB: { norm:'象', prom:'相' },                // 小角 → 小角成
  SH: { norm:'盾', prom:'楯' },                // 盾 → 盾成
};
const ORDER = ['R','B','G','S','Nk','L','P','D','MR','MB','SH']; // for komadai display order
const VALUES      = { K:10000, R:10, B:8, G:6, S:5, Nk:4, L:3, P:1, D:9,  MR:4, MB:3, SH:3 };
const PROM_VALUES = { R:13, B:11, G:15, S:6, Nk:6, L:6, P:4, K:10000, D:16, MR:7, MB:6, SH:4 };

// ============ Shop ============
// Persistent within session. Applies only to SENTE (the human player buying these).
const SHOP_ITEMS = {
  king_promote:      { price: 10000, name: '王が成れる',      desc: '成ると全方向に走れる（クイーン化）' },
  gold_promote:      { price:  5000, name: '金が成れる',      desc: '金の動ける6方向すべてが走り駒化（前・斜め前・左右・後ろ全部スライド）' },
  start_pawn_prom:   { price: 10000, name: '最初から成歩',    desc: 'すべての歩が「と」状態で開始' },
  start_gold_prom:   { price:  5000, name: '最初から金成',    desc: '金が成った状態で開始（要：金成）', req:'gold_promote' },
  start_king_prom:   { price: 10000, name: '最初から王成',    desc: '王が成った状態で開始（要：王成）', req:'king_promote' },
